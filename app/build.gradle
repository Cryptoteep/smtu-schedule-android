plugins {
    id 'com.android.application'
}

// Optional release signing: put a keystore.properties in the project root with
//   storeFile=/absolute/or/relative/path.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
// Without it, release builds fall back to the debug key so the APK stays
// installable (fine for personal use; use a real key before publishing).
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.korabel.schedule'
    compileSdk 34

    defaultConfig {
        applicationId "com.korabel.schedule"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
        resourceConfigurations += ["ru"]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // v1 for Android 5–6, v2 for 7+, v3 (key rotation) for 9+
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    packaging {
        resources {
            // build metadata AGP adds outside the signature; nothing reads it on a phone
            excludes += ['META-INF/com/android/build/gradle/app-metadata.properties',
                         'META-INF/version-control-info.textproto',
                         'DebugProbesKt.bin', 'kotlin-tooling-metadata.json']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
        debug {
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            all {
                testLogging {
                    events "passed", "skipped", "failed"
                    exceptionFormat "full"
                }
            }
        }
    }

    lint {
        abortOnError true
        warningsAsErrors false
        // The app is Russian-only by design: every string lives in the code next
        // to the logic that builds it, so there is nothing to translate.
        disable 'GoogleAppIndexingWarning', 'SetTextI18n'
    }
}

dependencies {
    // Runtime: nothing. The app uses android.* and java.* only, which is what
    // keeps the APK at a few dozen kilobytes.
    // Tests run on the JVM against the pure-Java parser and date logic.
    testImplementation 'junit:junit:4.13.2'
}
