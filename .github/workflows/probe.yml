name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Can GitHub reach smtu.ru?
        run: |
          curl -s -o page.html -w "code=%{http_code} time=%{time_total}\n" --max-time 40 \
            -A "Mozilla/5.0 (Linux; Android 14) Chrome/126.0 Mobile" \
            https://www.smtu.ru/ru/listschedule/ || echo "FAILED"
          echo "групп на странице: $(grep -c viewschedule_new page.html || echo 0)"
